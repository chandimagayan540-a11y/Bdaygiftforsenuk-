<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Senuk</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-grad: linear-gradient(-45deg, #ff00cc, #ff66b2, #ff0066, #ff99cc, #cc0066);
        }

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #0d0d0d;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--pink-grad);
            background-size: 400% 400%;
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 0.5;
        }

        #toggle { display: none; }

        #toggle:checked ~ .bg-layer {
            opacity: 1;
            animation: pinkFlow 10s ease infinite;
        }

        @keyframes pinkFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .button {
            margin-top: 45vh;
            padding: 22px 60px;
            background: #fff;
            color: #222;
            cursor: pointer;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1.1rem;
            z-index: 50;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .button:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 20px 40px rgba(255, 0, 204, 0.4);
        }

        .birthday-box {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1.5s ease 1s;
            text-align: center;
            padding: 60px 20px 20px 20px;
            width: 100%;
        }

        .birthday-box h1 {
            margin: 0;
            font-family: 'Great Vibes', cursive; 
            font-size: 6.5rem;
            color: white;
            background: linear-gradient(to bottom, #fff 30%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
        }

        .sub-text {
            color: white;
            font-size: 1.2rem;
            margin-top: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .gallery {
            width: 90%;
            max-width: 800px;
            margin: 40px auto 60px auto;
            display: flex;
            flex-direction: column;
            gap: 60px;
            opacity: 0;
            transition: opacity 2s ease 2.5s;
        }

        .pic-card {
            width: 280px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            cursor: zoom-in;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s;
        }

        .pic-card:nth-child(odd) { align-self: flex-start; }
        .pic-card:nth-child(even) { align-self: flex-end; }

        .pic-card.zoomed {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.5) !important;
            z-index: 1000;
            cursor: zoom-out;
            background: rgba(20, 20, 20, 0.9);
            width: 320px;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 999;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .img-box {
            width: 100%;
            aspect-ratio: 1/1;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .caption {
            color: white;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .footer-text {
            opacity: 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            padding: 40px 20px;
            text-align: center;
            letter-spacing: 1px;
            transition: opacity 2s ease 3.5s;
        }

        .sparkle-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 3s ease 1s;
        }

        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: fall infinite linear;
        }

        #toggle:checked ~ .main-wrapper .button { display: none; }
        #toggle:checked ~ .main-wrapper .birthday-box,
        #toggle:checked ~ .main-wrapper .gallery,
        #toggle:checked ~ .main-wrapper .footer-text { opacity: 1; transform: translateY(0); }
        #toggle:checked ~ .sparkle-container { opacity: 1; }

        @keyframes fall {
            from { transform: translateY(-10vh); }
            to { transform: translateY(110vh); }
        }

        @media (max-width: 600px) {
            .birthday-box h1 { font-size: 4rem; }
            .pic-card { width: 220px; align-self: center !important; }
        }
    </style>
</head>
<body>

    <input type="checkbox" id="toggle">
    <div class="bg-layer"></div>
    <div class="overlay" id="overlay"></div>

    <div class="main-wrapper">
        <label for="toggle" class="button">Open Your Surprise</label>

        <div class="sparkle-container" id="sparkle-container"></div>

        <div class="birthday-box">
            <h1>Happy Birthday Senuk!!</h1>
            <div class="sub-text">From your friend Tharin.</div>
            <audio src="t.mp3" loop></audio>
        </div>

        <div class="gallery">
            <div class="pic-card" onclick="toggleZoom(this)">
                <div class="img-box"><img src="seunk.jpg" alt="1"></div>
                <div class="caption">Happy 14th birthday</div>
            </div>
            <div class="pic-card" onclick="toggleZoom(this)">
                <div class="img-box"><img src="senuk1.jpg" alt="2"></div>
                <div class="caption">May all your wishes come true</div>
            </div>
            <div class="pic-card" onclick="toggleZoom(this)">
                <div class="img-box"><img src="senuk2.jpg" alt="3"></div>
                <div class="caption">Hope you enjoy your special day</div>
            </div>
            <div class="pic-card" onclick="toggleZoom(this)">
                <div class="img-box"><img src="senuk3.jpg" alt="4"></div>
                <div class="caption">"so cute" said my mom</div>
            </div>
            <div class="pic-card" onclick="toggleZoom(this)">
                <div class="img-box"><img src="senuk4.jpg" alt="5"></div>
                <div class="caption">Stay awesome </div>
            </div>
            <div class="pic-card" onclick="toggleZoom(this)">
                <div class="img-box"><img src="senuk5.jpg" alt="6"></div>
                <div class="caption">Cheers to many more years</div>
            </div>
        </div>

        <div class="footer-text">
            🥳I hope you enjoyed this.🥳
        </div>
    </div>

    <script>
        const toggle = document.getElementById('toggle');
        const audio = document.querySelector('audio');
        const container = document.getElementById('sparkle-container');
        const overlay = document.getElementById('overlay');

        function toggleZoom(card) {
            card.classList.toggle('zoomed');
            overlay.classList.toggle('active');
        }

        overlay.addEventListener('click', () => {
            const zoomedCard = document.querySelector('.pic-card.zoomed');
            if (zoomedCard) zoomedCard.classList.remove('zoomed');
            overlay.classList.remove('active');
        });

        for (let i = 0; i < 100; i++) {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.style.width = s.style.height = (Math.random() * 4 + 2) + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.animationDuration = (Math.random() * 5 + 5) + 's';
            s.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(s);
        }

        toggle.addEventListener('change', function() {
            if (this.checked) audio.play().catch(() => {});
        });
        
    </script>
</body>
</html>
